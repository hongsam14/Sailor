name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    steps:
      # TODO(SECURITY-10): repin this action to a full commit SHA at first release.
      # Left as a tag here because the SHA must be verified against the upstream release,
      # and fabricating one would be worse than an explicit, reviewed TODO.
      - uses: actions/checkout@v4

      - name: Install shellcheck + bats
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck bats

      - name: Run quality gate (shellcheck + bats + property harness)
        run: bash tests/run-all.sh
        env:
          SAILOR_SEED: "12345"
          SAILOR_ITER: "40"

      - name: Verify payload.manifest is up to date (deterministic)
        run: |
          bash scripts/gen-payload-manifest.sh
          git diff --exit-code payload.manifest || {
            echo "payload.manifest is stale — run scripts/gen-payload-manifest.sh and commit."; exit 1; }
